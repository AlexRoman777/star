name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Catch newly disclosed vulnerabilities in dependencies that have not changed.
    - cron: '23 6 * * 1'

permissions:
  contents: read

jobs:
  secrets:
    name: Secrets (gitleaks)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          VERSION=8.21.2
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Scan
        run: gitleaks detect --source . --config .gitleaks.toml --redact --no-banner --verbose

  config:
    name: Container and workflow config (checkov)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - run: pip install --disable-pip-version-check checkov
      - name: Scan
        run: |
          checkov --directory . \
            --framework dockerfile,github_actions,secrets \
            --skip-path node_modules --skip-path .venv --skip-path frontend/node_modules \
            --compact --quiet

  static-analysis:
    name: Static analysis (semgrep)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - run: pip install --disable-pip-version-check semgrep==1.185.0
      - name: Scan
        # Reads the code for insecure patterns. Exceptions are written next to the line they
        # cover, with the reason, or in .semgrepignore.
        run: semgrep scan --config p/default --metrics off --error --quiet

  dependencies:
    name: Dependencies (trivy)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install trivy
        run: |
          VERSION=0.76.2
          curl -sSfL "https://github.com/aquasecurity/trivy/releases/download/v${VERSION}/trivy_${VERSION}_Linux-64bit.tar.gz" \
            | tar -xz -C /usr/local/bin trivy
          trivy --version
      - name: Filesystem scan
        run: trivy fs . --scanners vuln,misconfig --severity HIGH,CRITICAL --exit-code 1 --skip-dirs node_modules --skip-dirs frontend/node_modules --skip-dirs .venv
