[project]
name = "star"
version = "272.0.0"
description = "Local-first photo curation for Immich: local vision models propose star ratings, the owner decides"
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = { text = "AGPL-3.0-or-later" }
dependencies = [
  "alembic>=1.19.1,<2",
  "argon2-cffi>=25,<26",
  "asyncpg>=0.30,<1",
  "cryptography>=50.0.0,<51",
  "fastapi>=0.141.1,<0.142",
  "httpx>=0.28,<0.29",
  "imagehash>=4.3,<5",
  "jsonschema>=4.26,<5",
  "numpy>=2.5.2,<3",
  "orjson>=3.12,<4",
  "pillow>=13,<14",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.15,<3",
  "python-json-logger>=4.2,<5",
  "sqlalchemy[asyncio]>=2.0.52,<2.2",
  "uvicorn[standard]>=0.52.4,<1",
]

[project.scripts]
star-agent = "star.agent_main:main"

[dependency-groups]
dev = [
  "aiosqlite>=0.21,<1",
  "mypy>=2.3.1,<3",
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=1.1,<2",
  "pytest-cov>=7.1,<8",
  "pytest-xdist>=3.6,<4",
  "pyyaml>=6,<7",
  "respx>=0.22,<1",
  "ruff>=0.16.4,<1",
  "testcontainers[postgres]>=4.15,<5",
  "types-jsonschema>=4.26.0.20260518,<5",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/src/star"]

[tool.pytest.ini_options]
# -n auto: the suite runs on every core (in-memory SQLite per test, so it is
# parallel-safe); pass -n 0 for one test or when reading a traceback.
addopts = "-ra --strict-markers --strict-config -n auto"
asyncio_mode = "auto"
testpaths = ["backend/tests"]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["backend/src", "backend/tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "S", "RUF"]
ignore = ["B008", "S101"]

[tool.ruff.lint.per-file-ignores]
"backend/tests/**/*.py" = ["S105", "S106", "S107"]
"backend/src/star/agent/capacity.py" = ["E402", "S603", "S607"]

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "backend/src"
packages = ["star"]

[tool.coverage.run]
branch = true
source = ["star"]
