pid /tmp/nginx.pid;
worker_processes auto;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    charset utf-8;
    server_tokens off;

    log_format star '$remote_addr - $request_method $uri $status $body_bytes_sent';
    map $uri $star_loggable {
        default 1;
        /api/v1/health/live 0;
        /api/v1/workers/heartbeat 0;
        /api/v1/workers/tasks/lease 0;
    }
    access_log /dev/stdout star if=$star_loggable;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    sendfile on;
    gzip on;
    gzip_types application/javascript application/json image/svg+xml text/css text/plain;
    client_max_body_size 32m;
    resolver 127.0.0.11 ipv6=off valid=30s;

    server {
        listen 8080;
        server_name _;
        root /srv;

        add_header Content-Security-Policy "default-src 'self'; img-src 'self' blob: data:; media-src 'self' blob:; connect-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        location /api/ {
            proxy_pass http://api:8000;
            proxy_http_version 1.1;
            proxy_set_header Host api;
            # Nginx overwrites the private edge marker, so clients cannot forge it.
            proxy_set_header X-Star-Edge star-edge;
            proxy_set_header X-Star-Client-IP $remote_addr;
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Forwarded-Proto http;
            proxy_buffering off;
            proxy_cache off;
            # Large, bounded Immich metadata batches can take several minutes on the NAS.
            proxy_read_timeout 1800s;
            proxy_send_timeout 1800s;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
